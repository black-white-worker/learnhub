# =====================================================================
# learningplatform 应用层（服务器版）
# 中间件不在本文件里：先启动 deploy/server/docker-compose.infra.yml
# 启动：docker compose -f docker-compose.server.yml --env-file .env.prod up -d --build
# =====================================================================
name: lp-app

services:
  # Flyway 版本化迁移：每次启动先跑一遍，已执行过的版本自动跳过
  flyway:
    image: flyway/flyway:10.20.0-alpine
    container_name: lp-flyway
    restart: "no"
    command:
      - -url=jdbc:mysql://mysql:3306/${DB_NAME}?sslMode=DISABLED&allowPublicKeyRetrieval=true
      - -user=root
      - -password=${MYSQL_ROOT_PASSWORD}
      - -connectRetries=30
      - -baselineOnMigrate=true
      - migrate
    volumes:
      - ./backend/deploy/sql/migration:/flyway/sql:ro
    networks: [default, shared]

  lp-backend:
    build:
      context: ./backend
    container_name: lp-backend
    restart: unless-stopped
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/${DB_NAME}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_HOST: redis:6379
      REDIS_PASS: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      # 浏览器拿到的对象地址：公网 IP + 共享 MinIO 的 9010
      MINIO_PUBLIC_ENDPOINT: ${PUBLIC_HOST}:9010
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PRIVATE: ${MINIO_PRIVATE:-true}
      TZ: Asia/Shanghai
    ports:
      # 只给宿主机 curl 用，公网走前端 nginx 的 /api
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    # 文档预览会拉起 LibreOffice，留 320M 避免 OOM
    mem_limit: 320m
    memswap_limit: 768m
    # 常驻下限只压到 96M：这台机器上 learningplatform 优先级最低（Go 服务，并发压力小），
    # 内存紧张时让内核优先回收它，把热内存留给 videonest 和共享 MySQL。
    # 320M 的上限不动——LibreOffice 转换那一下是真的需要。
    mem_reservation: 96m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks: [default, shared]

  lp-frontend:
    build:
      context: ./frontend
    container_name: lp-frontend
    restart: unless-stopped
    depends_on:
      lp-backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # 覆盖镜像里的 default.conf：后端服务名改成 lp-backend
      - ./deploy/server/nginx/lp.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks: [default]

networks:
  default:
  shared:
    external: true
    name: lp-shared
