Name: learningplatform-api
Host: 0.0.0.0
Port: 8888
# 单个请求体最大字节数（视频上传用，1GB 兼容一请求传多个 500MB 视频）
MaxBytes: 1073741824

# MinIO 对象存储（课程封面 / 缩略图 / 视频）
# Endpoint / PublicEndpoint 通过环境变量注入：
#   Docker 内：  MINIO_ENDPOINT=minio:9000            （容器网络内连接）
#                MINIO_PUBLIC_ENDPOINT=127.0.0.1:9020 （浏览器访问地址，拼返回 URL 用）
#   本机直跑：  两者都填 127.0.0.1:9020
Minio:
  Endpoint: "${MINIO_ENDPOINT}"
  PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT}"
  AccessKey: "${MINIO_ACCESS_KEY}"
  SecretKey: "${MINIO_SECRET_KEY}"
  UseSSL: false
  Bucket: "${MINIO_BUCKET}"

# 上传大小限制（字节）
Upload:
  MaxCoverBytes: 5242880      # 封面 5MB
  MaxVideoBytes: 524288000    # 单个视频 500MB

# ===== MySQL 配置 =====
# 数据源通过环境变量 MYSQL_DSN 注入（本机直跑示例）：
#   MYSQL_DSN=root:<密码>@tcp(127.0.0.1:3316)/learningplatform?charset=utf8mb4&parseTime=true&loc=Local
# Docker Compose 里会自动指向 mysql 容器，无需手动设置。
Mysql:
  DataSource: "${MYSQL_DSN}"

# ===== Redis 配置 =====
# 地址与密码通过环境变量 REDIS_HOST / REDIS_PASS 注入
Redis:
  Host: "${REDIS_HOST}"
  Type: node
  Pass: "${REDIS_PASS}"
