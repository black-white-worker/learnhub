# =====================================================================
# 共享中间件（2C2G 服务器上只跑这一份）
#   MySQL   -> learningplatform + videonest 两个库（建议改用各自的独立账号，见 init/mysql/02-app-users.sql）
#   PG      -> heart_pilot（pgvector）
#   Redis   -> 三个项目用不同 database 隔离：0=learningplatform 1=videonest 2=heart-pilot
#   MinIO   -> 三个项目共用一个实例、三个桶
# 只暴露 MinIO 的 9010 到公网（预签名 URL 需要浏览器直连），其余端口只绑 127.0.0.1，靠 SSH 隧道管理。
# 启动：docker compose -f docker-compose.infra.yml --env-file .env up -d
#
# 【改这里要知道的事】
#   1) init/mysql/*.sql 只在数据卷第一次初始化时执行。卷已经存在的话改文件是不生效的，
#      必须手动进容器执行一次（02-app-users.sql 里写了命令）。
#   2) 本文件的 .env（deploy/server/.env）必须有 PUBLIC_HOST，MinIO 的 CORS 白名单由它拼出来。
# =====================================================================
name: lp-infra

services:
  mysql:
    image: mysql:8.4
    container_name: infra-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=96M
      - --max-connections=120
      - --skip-name-resolve
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: learningplatform
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 288m
    memswap_limit: 768m
    # 三个项目都压在同一个 mysqld 上，它是唯一"不能被换出就没人能干活"的组件：
    # 给它全机最高的常驻下限（192M），内存紧张时内核先回收别家的页。
    # 故意不动 innodb_flush_log_at_trx_commit（保持 1 = 每次提交刷盘）：
    # 这里存的是三个项目的业务数据，为了省一点 IO 把崩溃后的丢单风险引进来不值。
    mem_reservation: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks: [shared]

  postgres:
    image: pgvector/pgvector:pg16
    container_name: infra-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=40
      - -c
      - work_mem=2MB
    environment:
      POSTGRES_DB: heart_pilot
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d heart_pilot"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 128m
    memswap_limit: 512m
    # 只给 heart-pilot 用（优先级第二），常驻下限压到 96M，让位给 videonest
    mem_reservation: 96m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks: [shared]

  redis:
    image: redis:7.4-alpine
    container_name: infra-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 96mb
      # 不能再用 allkeys-lru：videonest 的转码分布式锁是"带 TTL 的 key + 看门狗续期"，
      # LRU 会在内存压力下把这个 key 当冷数据淘汰掉，锁直接消失，
      # 结果是同一个视频被两个消费者重复转码（写坏 processed/ 里的产物，还不报错）。
      # noeviction 的代价是内存打满时新写入报 OOM，属于"看得见、可回滚"的失败；
      # 而静默丢锁是不可见的错误，两者里必须选前者。
      # 前提：三个项目都给自己的 key 设 TTL（videonest 的缓存/计数、heart-pilot 的会话都带过期）。
      # 万一真撞上 OOM：先 docker exec infra-redis redis-cli -a ... info memory 看 used_memory，
      # 确认是缓存堆积再临时抬 --maxmemory（CONFIG SET maxmemory 128mb，不用重启）。
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    # maxmemory 96M 之上还有 AOF 缓冲和复制/命令缓冲，配额必须留 1.6 倍左右的余量，
    # 否则 Redis 自己没 OOM，容器先被 kill
    mem_limit: 160m
    memswap_limit: 320m
    mem_reservation: 96m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks: [shared]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: infra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # 原来是 "*"：任何网页都能拿浏览器向这台 MinIO 发请求。
      # 9010 是对公网开放的（预签名 URL 必须让浏览器直连），所以这里改成精确白名单：
      # 三个站点各自的 Origin + 本地开发常用的两个端口。
      # 端口对应关系：80=learningplatform、8081=heart-pilot、8082=videonest。
      # 加新域名/换端口只改这里或 .env 里的 MINIO_CORS_ORIGINS，不用动镜像。
      # 排查方式：浏览器 F12 看上传请求的 Origin 头，逐个补进列表；
      # 万一漏配导致上传报 CORS，临时回退成 "*" 即可立刻恢复（改完 up -d minio，秒级）。
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:-http://${PUBLIC_HOST:-localhost},http://${PUBLIC_HOST:-localhost}:80,http://${PUBLIC_HOST:-localhost}:8081,http://${PUBLIC_HOST:-localhost}:8082,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3001,http://127.0.0.1:3001}
      TZ: Asia/Shanghai
    ports:
      - "9010:9000"                 # 公网：预签名上传/播放必须能直连
      - "127.0.0.1:9011:9001"       # 控制台只给 SSH 隧道
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 192m
    memswap_limit: 512m
    # 上传/播放走的是流式分片，内存占用主要在读缓冲；128M 常驻够它把当前这段请求做完
    mem_reservation: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks: [shared]

  # 只负责建桶/设策略，跑完即退出
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: infra-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do sleep 2; done &&
        mc mb --ignore-existing local/learningplatform &&
        mc mb --ignore-existing local/heart-pilot &&
        mc mb --ignore-existing local/videonest &&
        mc anonymous set download local/videonest/processed || true;
        mc anonymous set download local/videonest/cover/processed || true;
        mc ilm rule add --prefix "staging/" --expire-days 1 local/videonest || true;
        echo "minio buckets ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [shared]

volumes:
  mysql_data:
  pg_data:
  redis_data:
  minio_data:

networks:
  shared:
    name: lp-shared
    driver: bridge
