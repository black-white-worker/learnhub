# learningplatform 前端 nginx（部署到服务器时挂载覆盖镜像里的同名文件）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1024m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 服务名改成 lp-backend：三个项目共用 lp-shared 网络，不能都叫 backend
    location /api/ {
        proxy_pass http://lp-backend:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 批改/出题这类调用要等 LLM，默认 60s 会被 nginx 先掐断
        proxy_read_timeout 300s;
    }

    # AI 答疑是 SSE：必须关响应缓冲，否则浏览器要等整段回答生成完才一次性收到，
    # 前端的逐字输出退化成十几秒白屏。Go 侧也发了 X-Accel-Buffering: no，这里再显式一遍。
    location /api/ai/chat {
        proxy_pass http://lp-backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /ws/ {
        proxy_pass http://lp-backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}
