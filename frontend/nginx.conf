# WebSocket 升级映射：根据请求头决定是否保持长连接。
# 默认 upgrade（走 WebSocket），空则 close（普通 HTTP）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许上传大文件（课程视频单文件最大 500MB，单次请求总上限 1GB）
    # nginx 默认只允许 1MB，不放开的话视频上传会直接 413
    client_max_body_size 1024m;

    # 前端路由（Vue Router）刷新时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 开头的请求反向代理到后端容器（与 vite 开发代理行为一致）
    location /api/ {
        proxy_pass http://backend:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 实时通知长连接：透传 Upgrade/Connection 头并切到 HTTP/1.1。
    # 注意：nginx.conf 在 docker build 阶段被 COPY 进镜像，改完必须重新
    # `docker compose build frontend` 才能生效，单纯重启容器不会更新。
    location /ws/ {
        proxy_pass http://backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}
