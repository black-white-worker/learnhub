# WebSocket 升级映射：根据请求头决定是否保持长连接。
# 默认 upgrade（走 WebSocket），空则 close（普通 HTTP）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许上传大文件（课程视频单文件最大 500MB，单次请求总上限 1GB）
    # nginx 默认只允许 1MB，不放开的话视频上传会直接 413
    client_max_body_size 1024m;

    # 入口 HTML 必须每次向服务器校验：否则浏览器会一直用缓存的旧 index.html，
    # 去请求早就随新构建消失的旧 hash chunk，表现就是「页面还是老样子、
    # 题干和选项都不显示」，强刷也不一定立刻好。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # 文件名带内容 hash，内容变了文件名就变，可以放心长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # 前端路由（Vue Router）刷新时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 开头的请求反向代理到后端容器（与 vite 开发代理行为一致）
    location /api/ {
        proxy_pass http://backend:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 批改/出题这类调用要等 LLM，默认 60s 会被 nginx 先掐断
        proxy_read_timeout 300s;
    }

    # AI 答疑是 SSE：必须关响应缓冲。开着缓冲时 nginx 会把整段回答攒齐才吐给浏览器，
    # 前端的逐字输出会退化成"转圈十几秒后一次性刷出来"。
    # Go 侧也发了 X-Accel-Buffering: no，这里显式写一遍，不依赖上游的响应头。
    location /api/ai/chat {
        proxy_pass http://backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # AI 出题：带 Accept: text/event-stream 时是阶段进度流（准备蓝图 → 检索资料
    # → 模型命制 → 质量校验 → 完成），同样必须逐块到达浏览器；不带该头时仍是
    # 普通 JSON，走这一段也无害。模型生成那几十秒由服务端心跳保活。
    location /api/ai/generate {
        proxy_pass http://backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # WebSocket 实时通知长连接：透传 Upgrade/Connection 头并切到 HTTP/1.1。
    # 注意：nginx.conf 在 docker build 阶段被 COPY 进镜像，改完必须重新
    # `docker compose build frontend` 才能生效，单纯重启容器不会更新。
    location /ws/ {
        proxy_pass http://backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}
